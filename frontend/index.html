<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Draw Realtime — AI Video Studio</title>
    <meta name="description" content="Real-time video-to-video AI diffusion with StreamDiffusion. Transform videos using AI-powered style transfer." />
    
    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Typography: Playfair Display (elegant serif) + Inter (clean sans-serif) -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
      /* CSS Custom Properties - Art Studio Dark Theme */
      :root {
        /* Core Colors */
        --color-bg-primary: #0d0d12;
        --color-bg-secondary: #14141a;
        --color-bg-tertiary: #1a1a22;
        --color-bg-card: rgba(26, 26, 34, 0.85);
        --color-bg-hover: rgba(255, 255, 255, 0.04);
        
        /* Accent Colors - Warm Amber/Gold Palette */
        --color-accent-primary: #f59e0b;
        --color-accent-secondary: #fbbf24;
        --color-accent-glow: rgba(245, 158, 11, 0.3);
        --color-accent-subtle: rgba(245, 158, 11, 0.15);
        
        /* Text Colors */
        --color-text-primary: #fafaf9;
        --color-text-secondary: #a8a29e;
        --color-text-muted: #78716c;
        --color-text-inverse: #0d0d12;
        
        /* Status Colors */
        --color-success: #10b981;
        --color-warning: #f59e0b;
        --color-error: #ef4444;
        --color-info: #3b82f6;
        
        /* Border & Shadow */
        --color-border: rgba(255, 255, 255, 0.08);
        --color-border-focus: rgba(245, 158, 11, 0.5);
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
        --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.4);
        --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.5);
        --shadow-glow: 0 0 40px var(--color-accent-glow);
        
        /* Spacing Scale */
        --space-xs: 0.25rem;
        --space-sm: 0.5rem;
        --space-md: 1rem;
        --space-lg: 1.5rem;
        --space-xl: 2rem;
        --space-2xl: 3rem;
        --space-3xl: 4rem;
        
        /* Typography Scale */
        --font-display: 'Playfair Display', Georgia, serif;
        --font-body: 'Inter', system-ui, sans-serif;
        
        --text-xs: 0.75rem;
        --text-sm: 0.875rem;
        --text-base: 1rem;
        --text-lg: 1.125rem;
        --text-xl: 1.25rem;
        --text-2xl: 1.5rem;
        --text-3xl: 2rem;
        --text-4xl: 2.5rem;
        
        /* Border Radius */
        --radius-sm: 6px;
        --radius-md: 10px;
        --radius-lg: 16px;
        --radius-xl: 24px;
        
        /* Transitions */
        --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
        --transition-base: 250ms cubic-bezier(0.4, 0, 0.2, 1);
        --transition-slow: 350ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* Reset & Base Styles */
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: var(--font-body);
        font-size: var(--text-base);
        line-height: 1.6;
        color: var(--color-text-primary);
        background: var(--color-bg-primary);
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Subtle canvas texture overlay */
      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        opacity: 0.03;
        pointer-events: none;
        z-index: 1;
      }

      /* Ambient gradient orbs for depth */
      body::after {
        content: '';
        position: fixed;
        top: -50%;
        right: -20%;
        width: 80vw;
        height: 80vw;
        background: radial-gradient(circle, rgba(245, 158, 11, 0.08) 0%, transparent 70%);
        pointer-events: none;
        z-index: 0;
        animation: ambientPulse 20s ease-in-out infinite;
      }

      @keyframes ambientPulse {
        0%, 100% { transform: scale(1); opacity: 0.5; }
        50% { transform: scale(1.1); opacity: 0.8; }
      }

      /* Selection styling */
      ::selection {
        background: var(--color-accent-subtle);
        color: var(--color-accent-secondary);
      }

      /* Scrollbar styling */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      ::-webkit-scrollbar-track {
        background: var(--color-bg-secondary);
      }

      ::-webkit-scrollbar-thumb {
        background: var(--color-border);
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: var(--color-text-muted);
      }

      /* Focus visible for accessibility */
      :focus-visible {
        outline: 2px solid var(--color-accent-primary);
        outline-offset: 2px;
      }

      /* Reduced motion preference */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
        
        body::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
