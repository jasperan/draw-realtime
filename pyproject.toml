[project]
name = "draw-realtime"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "xformers",
    "diffusers==0.24.0",
    "transformers==4.36.0",
    "accelerate==0.25.0",
    "huggingface_hub==0.20.3",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "python-multipart",
    "websockets",
    "pydantic>=2.0.0",
    "markdown2",
    "opencv-python-headless",
    "Pillow",
    "numpy<2",
    "fire",
    "omegaconf"
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "httpx>=0.27,<0.28",
    "ruff>=0.8,<1",
    "bandit>=1.7,<2",
    "pip-audit>=2.7,<3"
]

[tool.pytest.ini_options]
# The real test suite lives in tests/. Exploratory GPU scripts under scripts/
# (test_*.py) are run by hand and import optional deps at module scope, so they
# must not be swept up by pytest collection.
testpaths = ["tests"]

[tool.uv]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
